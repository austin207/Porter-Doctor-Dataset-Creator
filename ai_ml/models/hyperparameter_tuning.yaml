# Hyperparameter search spaces for TensorFlow/Keras models.

defaults:
  search:
    method: grid
    max_combinations: 48
    metric: val_fault_output_accuracy
    repeats: 3
    embedded_score:
      accuracy_weight: 1.0
      size_penalty_weight: 0.08
      instability_penalty_weight: 0.15

classifier_models:
  power_expert:
    config: ai_ml/models/power_expert/config.json
    params:
      hidden_layers: [[8, 4], [12, 6], [16, 8], [24, 12], [32, 16]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

  motor_expert:
    config: ai_ml/models/motor_expert/config.json
    params:
      hidden_layers: [[12, 6], [16, 8], [24, 12], [32, 16], [48, 24]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

  motor_driver_expert:
    config: ai_ml/models/motor_driver_expert/config.json
    params:
      hidden_layers: [[12, 6], [16, 8], [24, 12], [32, 16], [48, 24]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

  esp32_expert:
    config: ai_ml/models/esp32_expert/config.json
    params:
      hidden_layers: [[8, 4], [12, 6], [16, 8], [24, 12], [32, 16]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

  lighting_expert:
    config: ai_ml/models/lighting_expert/config.json
    params:
      hidden_layers: [[6, 3], [8, 4], [12, 6], [16, 8], [24, 12]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

  router:
    config: ai_ml/models/router/config.json
    params:
      hidden_layers: [[8, 4], [12, 6], [16, 8], [24, 12], [32, 16]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]

anomaly_models:
  anomaly_detector:
    config: ai_ml/models/anomaly_detector/config.json
    params:
      hidden_layers: [[8, 4, 8], [12, 6, 12], [16, 8, 16], [24, 8, 24], [32, 12, 32]]
      learning_rate: [0.001, 0.0007, 0.0005]
      batch_size: [8, 16]
      epochs: [60, 100]
